version: 2.1

orbs:
  ruby: circleci/ruby@2.2
  node: circleci/node@6.1

executors:
  backend:
    docker:
      - image: cimg/ruby:3.4.8
        environment:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/portfolio_test
      - image: cimg/postgres:17.11
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio_test

  frontend:
    docker:
      - image: cimg/node:22.23.3

jobs:
  test_backend:
    executor: backend
    working_directory: ~/project/backend
    steps:
      - checkout:
          path: ~/project

      - ruby/install-deps:
          key: gems-v1

      - run:
          name: Wait for PostgreSQL
          command: dockerize -wait tcp://localhost:5432 -timeout 30s

      - run:
          name: Set up database
          command: bin/rails db:schema:load

      - run:
          name: Run tests
          command: bundle exec rspec --format documentation

      - run:
          name: Lint
          command: bin/rubocop

      - run:
          name: Security audit (dependencies)
          command: bundle exec bundler-audit check --update

      - run:
          name: Security scan (static analysis)
          command: bundle exec brakeman --no-pager -q --exit-on-warn --exit-on-error

  test_frontend:
    executor: frontend
    working_directory: ~/project/frontend
    steps:
      - checkout:
          path: ~/project

      - node/install-packages:
          pkg-manager: npm

      - run:
          name: Type check
          command: npx vue-tsc --build --force

      - run:
          name: Lint
          command: npx eslint .

      - run:
          name: Check formatting
          command: npx prettier --check src/

      - run:
          name: Run tests
          command: npx vitest run --passWithNoTests

      - run:
          name: Security audit (dependencies)
          command: npm audit --audit-level=high --omit=dev

      - run:
          name: Build
          command: npx vite build

      - persist_to_workspace:
          root: ~/project/frontend
          paths:
            - dist

  validate_terraform:
    docker:
      - image: hashicorp/terraform:1.16
    working_directory: ~/project/infra
    steps:
      - checkout:
          path: ~/project

      - run:
          name: Check formatting
          command: terraform fmt -check -recursive

      - run:
          name: Init without the S3 backend
          command: terraform init -backend=false -input=false

      - run:
          name: Validate
          command: terraform validate

workflows:
  ci:
    jobs:
      - test_backend
      - test_frontend
      - validate_terraform
